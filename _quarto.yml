project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - "pages/**/*.qmd"
  resources:
    - ".nojekyll"

website:
  title: "R Hands-on Workshop Series"
  description: "A hands-on introduction to data analysis in R with the tidyverse, from the Yale Cushing/Whitney Medical Library"
  site-url: https://cwml.github.io/CWML-R-Hands-on-Workshop-Series/
  repo-url: https://github.com/CWML/CWML-R-Hands-on-Workshop-Series
  search: true
  page-navigation: true

  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Setup"
        href: pages/setup.qmd
      - text: "Lessons"
        href: pages/lessons/01-setup-and-first-look.qmd
      - text: "Data"
        href: pages/data.qmd
      - text: "Resources"
        href: pages/resources.qmd
      - text: "Instructor Guide"
        href: pages/instructor/index.qmd
    right:
      - icon: github
        href: https://github.com/CWML/CWML-R-Hands-on-Workshop-Series

  sidebar:
    - id: lessons
      title: "Lessons"
      style: docked
      contents:
        - pages/lessons/01-setup-and-first-look.qmd
        - pages/lessons/02-cleaning.qmd
        - pages/lessons/03-missing-data-joins-export.qmd
        - pages/lessons/04-data-structures.qmd
        - pages/lessons/05-summarizing.qmd
        - pages/lessons/06-plotting-basics.qmd
        - pages/lessons/07-plotting-further.qmd
        - pages/lessons/08-programming.qmd
    - id: instructor
      title: "Instructor Guide"
      style: docked
      contents:
        - pages/instructor/index.qmd
        - pages/instructor/session-01.qmd
        - pages/instructor/session-02.qmd
        - pages/instructor/session-03.qmd
        - pages/instructor/session-04.qmd
        - pages/instructor/session-05.qmd
        - pages/instructor/session-06.qmd
        - pages/instructor/session-07.qmd
        - pages/instructor/session-08.qmd

  page-footer:
    left: "Cushing/Whitney Medical Library, Yale School of Medicine"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    css: styles.css
    toc: true
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap

execute:
  freeze: auto
  message: false
  warning: false
